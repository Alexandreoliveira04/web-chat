services:
  postgres:
    image: postgres:16
    container_name: web-chat-postgres
    environment:
      POSTGRES_DB: webchat
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: webchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat -d webchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  gcs:
    image: fsouza/fake-gcs-server
    container_name: web-chat-gcs
    ports:
      - "4443:4443"
    command: -scheme http -public-host localhost:4443
    volumes:
      - gcs_data:/data

  app:
    build: .
    container_name: web-chat-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started
    environment:
      DB_HOST: postgres
      GCS_HOST: http://gcs:4443
      GCS_BUCKET: webchat-files
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-nao-use-em-producao-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@webchat.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  gcs_data:
