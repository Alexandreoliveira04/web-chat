<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ZapCord </title>
    <script>
        // Lógica de redirecionamento simples baseada na presença do token
        const token = localStorage.getItem('webchat_token');
        if (token) {
            window.location.replace('/chat.html');
        } else {
            window.location.replace('/login.html');
        }
    </script>
</head>
<body style="background-color: #1e1f22; color: #dbdee1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h2>Redirecionando...</h2>
</body>
</html>
