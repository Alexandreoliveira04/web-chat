# Perfil usado pelos testes: banco em memoria, sem dependencia de Docker.
#
# O schema dos testes e gerado a partir das entidades (create-drop), e nao pelas
# migrations: o Flyway fica desabilitado. Em contrapartida, as migrations nao sao
# exercitadas aqui - elas sao validadas na inicializacao contra o PostgreSQL real,
# onde o Hibernate roda em ddl-auto=validate.
spring:
  datasource:
    url: jdbc:h2:mem:webchat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
