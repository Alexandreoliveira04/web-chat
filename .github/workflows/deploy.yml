# Deploy automatico: cada push na main (ou seja, cada merge) roda os testes e, se passarem,
# publica a nova versao no Cloud Run. So a imagem do app muda: variaveis de ambiente,
# segredos, trava de custo e limites continuam como o deploy/gcp.sh deixou.
#
# O login no Google nao usa chave guardada no GitHub: o Google confia nos tokens do GitHub
# Actions deste repositorio, so da branch main (Workload Identity Federation, configurada
# uma vez por deploy/github-actions.sh). Os valores abaixo nao sao segredos.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um novo push espera o anterior terminar em vez de cancela-lo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: web-chat-507300
  REGION: us-central1
  SERVICE: webchat
  WORKLOAD_IDENTITY_PROVIDER: projects/526263320837/locations/global/workloadIdentityPools/github/providers/web-chat
  DEPLOYER_SERVICE_ACCOUNT: webchat-deployer@web-chat-507300.iam.gserviceaccount.com
  APP_URL: https://webchat-526263320837.us-central1.run.app

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes do backend
        working-directory: backend
        run: ./mvnw -B -q test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Publicar no Cloud Run
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # token OIDC que o Google troca por uma credencial temporaria
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Constroi a imagem no Cloud Build a partir do Dockerfile e troca a revisao do servico.
      - name: Deploy
        run: gcloud run deploy "$SERVICE" --source . --region="$REGION" --project="$PROJECT_ID" --quiet

      - name: Conferir se o app subiu
        run: |
          for tentativa in $(seq 1 10); do
            if curl -sf --max-time 60 "$APP_URL/api/v1/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "O app nao respondeu depois do deploy" >&2
          exit 1
