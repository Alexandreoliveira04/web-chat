spring:
  application:
    name: web-chat

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:webchat}
    username: ${DB_USER:webchat}
    password: ${DB_PASSWORD:webchat}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}

app:
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server:
  port: ${SERVER_PORT:8080}
